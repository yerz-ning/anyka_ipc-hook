name: Build P2P Hook (AK3918)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create hook_p2p.c
        run: |
          cat > hook_p2p.c << 'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/socket.h>
          #include <netinet/in.h>
          #include <arpa/inet.h>
          #include <stdlib.h>
          #include <string.h>
          int yi_p2p_send_frame_data(int conn_id, void *header, void *data, int len) {
              static int (*orig)(int, void*, void*, int) = NULL;
              if (!orig) {
                  orig = (int (*)(int, void*, void*, int))dlsym(RTLD_NEXT, "yi_p2p_send_frame_data");
                  if (!orig) {
                      fprintf(stderr, "Failed to find yi_p2p_send_frame_data\n");
                      return -1;
                  }
              }
              int ret = orig(conn_id, header, data, len);
              if (data && len > 0) {
                  int sock = socket(AF_INET, SOCK_DGRAM, 0);
                  if (sock >= 0) {
                      struct sockaddr_in addr;
                      memset(&addr, 0, sizeof(addr));
                      addr.sin_family = AF_INET;
                      addr.sin_port = htons(8080);
                      addr.sin_addr.s_addr = inet_addr("127.0.0.1");
                      sendto(sock, data, len, 0, (struct sockaddr*)&addr, sizeof(addr));
                      close(sock);
                  }
              }
              return ret;
          }
          EOF

      - name: Download ARMv5 uClibc toolchain
        run: |
          wget https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--uclibc--stable-2024.02-1.tar.bz2
          tar -xjf armv5-eabi--uclibc--stable-2024.02-1.tar.bz2
          echo "TOOLCHAIN_PATH=$PWD/armv5-eabi--uclibc--stable-2024.02-1" >> $GITHUB_ENV

      - name: Compile hook_p2p.so
        run: |
          export PATH=${{ env.TOOLCHAIN_PATH }}/bin:$PATH
          arm-linux-gcc -shared -fPIC -o hook_p2p.so hook_p2p.c -ldl

      - name: Upload hook_p2p.so
        uses: actions/upload-artifact@v4
        with:
          name: hook-p2p-armv5
          path: hook_p2p.so
