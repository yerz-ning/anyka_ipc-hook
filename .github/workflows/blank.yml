name: Build Hook Library (ARMv5)

on:
  push:
    paths:
      - 'hook.c'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Compile hook.so
        run: |
          arm-linux-gnueabi-gcc -shared -fPIC -o hook.so hook.c -ldl

      - name: Upload hook.so
        uses: actions/upload-artifact@v4
        with:
          name: hook-armv5
          path: hook.so
