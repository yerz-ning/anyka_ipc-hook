name: Build Hook Library (uClibc ARMv5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download uClibc toolchain (armv5)
        run: |
          wget https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--uclibc--stable-2024.02-1.tar.bz2
          tar -xjf armv5-eabi--uclibc--stable-2024.02-1.tar.bz2
          echo "TOOLCHAIN_PATH=$PWD/armv5-eabi--uclibc--stable-2024.02-1" >> $GITHUB_ENV

      - name: Create hook.c
        run: |
          cat > hook.c << 'EOF'
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <stdio.h>
          #include <sys/types.h>
          #include <sys/stat.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <errno.h>

          typedef int (*orig_GetVideoFrame_func)(void* pDmx, unsigned char** ppData, int* pLen);
          static orig_GetVideoFrame_func orig_GetVideoFrame = NULL;

          int MediaLib_Dmx_GetVideoFrame(void* pDmx, unsigned char** ppData, int* pLen) {
              if (!orig_GetVideoFrame) {
                  orig_GetVideoFrame = (orig_GetVideoFrame_func)dlsym(RTLD_NEXT, "MediaLib_Dmx_GetVideoFrame");
                  if (!orig_GetVideoFrame) return -1;
              }
              int ret = orig_GetVideoFrame(pDmx, ppData, pLen);
              if (ret == 0 && ppData && *ppData && pLen && *pLen > 0) {
                  int fd = open("/tmp/camera_fifo", O_WRONLY | O_NONBLOCK);
                  if (fd >= 0) {
                      write(fd, *ppData, *pLen);
                      close(fd);
                  }
              }
              return ret;
          }
          EOF

      - name: Compile hook.so with uClibc toolchain
        run: |
          export PATH=${{ env.TOOLCHAIN_PATH }}/bin:$PATH
          arm-linux-gcc -shared -fPIC -o hook.so hook.c -ldl

      - name: Upload hook.so
        uses: actions/upload-artifact@v4
        with:
          name: hook-uclibc-armv5
          path: hook.so
